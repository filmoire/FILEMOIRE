name: Website monitor
on:
  workflow_dispatch:
  schedule:
    # Four checks per day; this does not keep a free Render service awake.
    - cron: "23 */6 * * *"
permissions:
  contents: read
concurrency:
  group: website-monitor
  cancel-in-progress: false
jobs:
  public-health:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Check monitor behavior
        run: node --test scripts/production/monitor.test.mjs
      - name: Check deployed website
        run: node scripts/production/monitor.mjs
