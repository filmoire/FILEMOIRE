name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    # Keep the OS within the supported matrix of the pinned Playwright release.
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: filemoire_test
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: filemoire_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U filemoire_test" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://filemoire_test:test_only@127.0.0.1:5432/filemoire_test
      DATABASE_URL: postgres://filemoire_test:test_only@127.0.0.1:5432/filemoire_test
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable && corepack prepare pnpm@10.28.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pnpm db:migrate
      - run: pnpm verify
      - run: pnpm build:html && pnpm build:worker
      - run: pnpm test:integration
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm test:live
      - run: pnpm audit:production
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-evidence
          path: |
            playwright-report/
            test-results/
